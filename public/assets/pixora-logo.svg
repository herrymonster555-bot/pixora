<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Green alien character logo -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#C6FF00" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Alien head -->
  <ellipse cx="64" cy="58" rx="42" ry="40" fill="#2ECC71" filter="url(#glow)"/>

  <!-- Eyes -->
  <ellipse cx="48" cy="48" rx="12" ry="14" fill="#0D0D0D"/>
  <ellipse cx="80" cy="48" rx="12" ry="14" fill="#0D0D0D"/>

  <!-- Eye highlights -->
  <ellipse cx="45" cy="44" rx="3" ry="4" fill="#4ECDC4"/>
  <ellipse cx="77" cy="44" rx="3" ry="4" fill="#4ECDC4"/>

  <!-- Antennae -->
  <path d="M38 18 Q28 8 24 16" stroke="#2ECC71" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M90 18 Q100 8 104 16" stroke="#2ECC71" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="24" cy="16" r="5" fill="#2ECC71"/>
  <circle cx="104" cy="16" r="5" fill="#2ECC71"/>

  <!-- Mouth -->
  <path d="M54 72 Q64 80 74 72" stroke="#0D0D0D" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>